<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VR Игры</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>🎮 Вибери гру</h1>
        <p>Тапни на гру для перегляду відео</p>
    </header>

    <nav class="filters">
        <button class="filter-btn active" data-filter="all">Всі</button>
        <button class="filter-btn" data-filter="horror">Хорори</button>
        <button class="filter-btn" data-filter="shooter">Шутери</button>
        <button class="filter-btn" data-filter="family">Сімейні</button>
    </nav>

    <main class="games-grid" id="games-container"></main>

    <div id="game-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-desc"></p>
            <div class="video-container">
                <video id="modal-video" controls autoplay muted loop playsinline></video>
            </div>
            <div class="admin-panel">
                <h4>🔧 Для адміну:</h4>
                <div class="admin-grid">
                    <div><strong>Окуляри:</strong> <span id="modal-admin-headset"></span></div>
                    <div><strong>Значок:</strong> <span id="modal-admin-icon"></span></div>
                    <div><strong>ID:</strong> <span id="modal-admin-sysname" class="code-style"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
